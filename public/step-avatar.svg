<svg viewBox="0 0 500 500" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0d1b36" />
      <stop offset="70%" stop-color="#060c1b" />
      <stop offset="100%" stop-color="#040814" />
    </radialGradient>
    <filter id="ringGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#bgGlow)" />
  <circle cx="250" cy="250" r="230" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.85" filter="url(#ringGlow)" />
  <circle cx="250" cy="250" r="220" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.6" />

